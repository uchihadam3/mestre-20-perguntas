name: Laboratório Autônomo
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autonomous-lab
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:data
      - run: npm test
      - name: Simular, propor e avaliar sem alterar a estratégia publicada
        run: npm run lab:nightly -- --repeats=8 --search=4 --max-ms=1200000
      - name: Salvar relatórios e histórico da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laboratorio-${{ github.run_number }}
          path: |
            reports/nightly.json
            reports/nightly.md
          retention-days: 90
          if-no-files-found: warn
