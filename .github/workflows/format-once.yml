name: Format branch once
on:
  push:
    branches:
      - fix/palpites-seguros-e-evolucao
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/engine/inference.ts src/engine/inference.test.ts src/ui/App.tsx docs/ROADMAP_SEGUNDA_ETAPA.md
      - name: Commit Prettier format only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/inference.ts src/engine/inference.test.ts src/ui/App.tsx docs/ROADMAP_SEGUNDA_ETAPA.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format reviewed branch with Prettier"
            git push
          fi
