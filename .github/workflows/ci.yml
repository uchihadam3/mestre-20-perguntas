name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run validate:data
      - run: npm test
      - run: npm run lab:ci -- --gate=reports/regression.json
      - run: npm run build
      - name: Relatório de inteligência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laboratorio-pr
          path: |
            reports/ci.json
            reports/ci.md
          if-no-files-found: ignore
