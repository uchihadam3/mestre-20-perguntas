name: Temporary format fix for inference PR

on:
  push:
    branches:
      - fix/inferencia-sem-perguntas-redundantes
    paths:
      - .github/workflows/temporary-prettier-inference.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier
        run: npx prettier --write src/engine/logic.ts src/engine/inference.ts src/engine/inference.test.ts src/data/questions.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/logic.ts src/engine/inference.ts src/engine/inference.test.ts src/data/questions.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format logical inference patch"
            git push origin HEAD:fix/inferencia-sem-perguntas-redundantes
          fi
